name: MLOps CI/CD Pipeline

# Trigger on push and pull requests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # =========================================================================
  # STAGE 1: COMMIT STAGE (Continuous Integration)
  # =========================================================================
  
  commit-stage:
    name: Commit Stage - Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      # Step 2: Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pylint flake8 black isort
      
      # Step 4: Run Unit Tests (Fast, Isolated)
      - name: Run Unit Tests
        run: |
          echo "=========================================="
          echo "STAGE 1.1: Running Unit Tests"
          echo "=========================================="
          pytest mlops_pipeline.py::TestHashFeatureEngineer -v --tb=short
          echo "✓ Unit tests completed"
      
      # Step 5: Run Component Tests (Integration)
      - name: Run Component/Integration Tests
        run: |
          echo "=========================================="
          echo "STAGE 1.2: Running Component Tests"
          echo "=========================================="
          pytest mlops_pipeline.py::TestModelServingLogic -v --tb=short
          echo "✓ Component tests completed"
      
      # Step 6: Code Linting with Pylint
      - name: Lint with Pylint
        run: |
          echo "=========================================="
          echo "STAGE 1.3: Code Analysis - Pylint"
          echo "=========================================="
          pylint mlops_pipeline.py --fail-under=7.0 || true
          echo "✓ Pylint analysis completed"
      
      # Step 7: Code Style with Flake8
      - name: Check code style with Flake8
        run: |
          echo "=========================================="
          echo "STAGE 1.4: Code Analysis - Flake8"
          echo "=========================================="
          flake8 mlops_pipeline.py --max-line-length=100 --count --statistics
          echo "✓ Flake8 analysis completed"
      
      # Step 8: Code formatting check with Black
      - name: Check code formatting with Black
        run: |
          echo "=========================================="
          echo "STAGE 1.5: Code Formatting - Black"
          echo "=========================================="
          black --check mlops_pipeline.py || true
          echo "✓ Black formatting check completed"
      
      # Step 9: Generate test coverage report
      - name: Generate test coverage report
        run: |
          echo "=========================================="
          echo "STAGE 1.6: Test Coverage Analysis"
          echo "=========================================="
          pytest mlops_pipeline.py -v --cov=. --cov-report=term-missing
          echo "✓ Coverage report generated"
  
  # =========================================================================
  # STAGE 2: ACCEPTANCE GATE (Continuous Deployment)
  # =========================================================================
  
  acceptance-gate:
    name: Acceptance Gate - Build & Deploy
    runs-on: ubuntu-latest
    needs: commit-stage
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      
      # Step 4: Build & Package (Simulate Docker build)
      - name: Build & Package Application
        run: |
          echo "=========================================="
          echo "STAGE 2.1: Build & Package"
          echo "=========================================="
          echo "Creating deployable artifact..."
          mkdir -p build/
          cp mlops_pipeline.py build/
          cp requirements.txt build/ 2>/dev/null || echo "# No requirements.txt" > build/requirements.txt
          echo "✓ Application packaged successfully"
          echo "Artifact contents:"
          ls -la build/
      
      # Step 5: Simulate Docker build
      - name: Simulate Docker Build
        run: |
          echo "=========================================="
          echo "STAGE 2.2: Docker Build Simulation"
          echo "=========================================="
          echo "FROM python:3.11" > Dockerfile
          echo "WORKDIR /app" >> Dockerfile
          echo "COPY mlops_pipeline.py ." >> Dockerfile
          echo "RUN pip install pytest" >> Dockerfile
          echo "CMD [\"python\", \"mlops_pipeline.py\"]" >> Dockerfile
          echo "✓ Dockerfile created"
          cat Dockerfile
      
      # Step 6: Smoke Test - Service Health Check
      - name: Smoke Test - Service Health Check
        run: |
          echo "=========================================="
          echo "STAGE 2.3: Smoke Test - Health Check"
          echo "=========================================="
          python -c "
          import sys
          sys.path.insert(0, '.')
          from mlops_pipeline import SmokeTest
          
          print('Testing service health...')
          if SmokeTest.test_service_health():
              print('✓ Service health check PASSED (200 OK)')
              sys.exit(0)
          else:
              print('✗ Service health check FAILED')
              sys.exit(1)
          "
      
      # Step 7: Smoke Test - Prediction Request
      - name: Smoke Test - Prediction Request
        run: |
          echo "=========================================="
          echo "STAGE 2.4: Smoke Test - Prediction"
          echo "=========================================="
          python -c "
          import sys
          sys.path.insert(0, '.')
          from mlops_pipeline import SmokeTest
          
          print('Testing prediction endpoint...')
          if SmokeTest.test_service_prediction():
              print('✓ Prediction test PASSED (200 OK)')
              sys.exit(0)
          else:
              print('✗ Prediction test FAILED')
              sys.exit(1)
          "
      
      # Step 8: Deployment summary
      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "DEPLOYMENT SUMMARY"
          echo "=========================================="
          echo "✓ All acceptance tests passed"
          echo "✓ Application is ready for production"
          echo "✓ Deployment can proceed"
  
  # =========================================================================
  # STAGE 3: STOP THE LINE SIMULATION (Optional - for demonstration)
  # =========================================================================
  
  stop-the-line-demo:
    name: Stop The Line Simulation
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[SABOTAGE]')
    
    steps:
      - name: Intentional Failure - Demonstrating Stop The Line
        run: |
          echo "=========================================="
          echo "INTENTIONAL FAILURE - Stop The Line Demo"
          echo "=========================================="
          echo "A bug was introduced in the code."
          echo "The CI pipeline detected it and STOPPED THE LINE."
          echo "Deployment is BLOCKED until the bug is fixed."
          echo "=========================================="
          exit 1

# ============================================================================
# WORKFLOW SUMMARY
# ============================================================================
# This workflow implements the complete MLOps CI/CD pipeline:
#
# COMMIT STAGE (Continuous Integration):
#   ✓ Unit Tests: Fast, isolated tests with no external dependencies
#   ✓ Component Tests: Integration tests with data sources
#   ✓ Code Linting: Pylint, Flake8 for code quality
#   ✓ Code Formatting: Black for consistent style
#   ✓ Coverage Analysis: Test coverage reporting
#
# ACCEPTANCE GATE (Continuous Deployment):
#   ✓ Build & Package: Create deployable artifacts
#   ✓ Docker Build: Containerize the application
#   ✓ Smoke Tests: Verify service health and functionality
#   ✓ Deployment: Only proceed if all tests pass
#
# STOP THE LINE:
#   ✓ If any stage fails, the pipeline stops
#   ✓ Bad code is prevented from entering production
#   ✓ Developers must fix issues before deployment
# ============================================================================
